name: History checkpoint cache probe
on:
  workflow_dispatch:
    inputs:
      large-archive:
        description: Exercise saving and restoring an archive above the former 512 MiB limit
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: ezshare-${{ github.actor_id }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          pnpm install --frozen-lockfile --prod
      - uses: ./.github/actions/checkpoint-probe
        env:
          EZSHARE_PROBE_LARGE_ARCHIVE: ${{ inputs.large-archive }}
          GH_TOKEN: ${{ github.token }}
