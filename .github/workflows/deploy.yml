name: Deploy launcher

# The launcher is published from the default branch whenever it changes, so it always matches the session
# workflows that run there. It is served by GitHub Pages on an origin of its own (see the CNAME setting).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Check and build the launcher
        env:
          VITE_GITHUB_APP_CLIENT_ID: ${{ vars.EZSHARE_GITHUB_APP_CLIENT_ID }}
          VITE_GITHUB_AUTH_ORIGIN: ${{ vars.EZSHARE_GITHUB_AUTH_ORIGIN }}
          VITE_DEFAULT_REPOSITORY: ${{ github.repository }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm ci:check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web

  deploy-authorization-worker:
    needs: build
    if: vars.EZSHARE_GITHUB_APP_CLIENT_ID != '' && vars.EZSHARE_GITHUB_AUTH_ORIGIN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: authorization-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Deploy authorization Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_APP_CLIENT_ID: ${{ vars.EZSHARE_GITHUB_APP_CLIENT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the authorization-worker environment.'
            exit 1
          fi
          npx --yes wrangler@4.154.0 deploy --config wrangler.authorization.jsonc --var "GITHUB_APP_CLIENT_ID:$GITHUB_APP_CLIENT_ID"
      - name: Verify authorization Worker
        env:
          WORKER_ORIGIN: ${{ vars.EZSHARE_GITHUB_AUTH_ORIGIN }}
        run: |
          set -o pipefail
          if ! curl --fail --silent --show-error --proto '=https' --max-time 10 --retry 2 --retry-max-time 25 \
            "${WORKER_ORIGIN%/}/health" | jq -e '.configured == true' > /dev/null; then
            echo '::error::Check the configured Worker origin and add GITHUB_APP_CLIENT_SECRET in Cloudflare before publishing the launcher.'
            exit 1
          fi

  deploy:
    needs: [build, deploy-authorization-worker]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.deploy-authorization-worker.result == 'success' ||
       needs.deploy-authorization-worker.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
