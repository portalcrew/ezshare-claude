name: ezshare chat session
run-name: ezshare-${{ github.actor_id }}-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Session request (UUID)
        type: string
        required: true
      issue:
        description: Mailbox issue number
        type: string
        required: true
      client_key:
        description: The member browser's channel key
        type: string
        required: true

      account:
        description: Shared Claude account identifier (legacy preserves the original secret)
        type: string
        default: legacy
        required: false
      access:
        description: Interface for this session
        type: choice
        options:
          - morty
          - vscode
        default: morty
        required: false

      reset_morty_identity:
        description: Delete local Morty state and create a new Computer, keeping Claude history and workspace
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: write
  issues: write

# One session per member at a time; members never wait on each other.
concurrency:
  group: ezshare-${{ github.actor_id }}
  cancel-in-progress: false

jobs:
  session:
    uses: ./.github/workflows/claude-session.yml
    with:
      access: ${{ inputs.access || 'morty' }}
    secrets:
      # Resolve the account on GitHub, before allocating a runner. The worker declares exactly one credential;
      # never use secrets: inherit here. zizmor cannot distinguish this server-side mapping from a runner env.
      claude_token: ${{ (inputs.account == '' || inputs.account == 'legacy') && secrets.EZSHARE_CLAUDE_TOKEN || secrets[format('EZSHARE_CLAUDE_ACCOUNT_{0}', inputs.account)] }} # zizmor: ignore[overprovisioned-secrets]
